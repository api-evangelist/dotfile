packages_note: >-
  Dotfile ships NO first-party client library, in any language. This is a searched zero, not an unchecked gap.
  Registries queried unauthenticated on 2026-08-17:
    - npm registry.npmjs.org — no @dotfile/* scope exists; @dotfile/sdk, @dotfile/node, dotfile-sdk and
      dotfile-node all return 404. The unscoped `dotfile` package DOES exist (HTTP 200) but is NOT Dotfile's:
      it is "easy way to read and write json dotfiles agnostic of the os", latest 0.0.2, repo
      git@github.com:dscape/dotfile, maintainer dscape <nunojobpinto@gmail.com>. Name collision only.
    - PyPI pypi.org — `dotfile` returns 200 but is "dot is a git wrapper for managing dotfiles" by Kyle
      Pollina, version 0.9.0, homepage github.com/kylepollina/dot. Not Dotfile. `dotfile-sdk` 404.
    - RubyGems, crates.io, NuGet, Maven Central, pkg.go.dev, Packagist — no first-party artifact located.
    - github.com/DotfileTech (the real Dotfile org, 8 public repos, links to www.dotfile.com) contains no
      client library. Its repos are data-export, dotfile-tms (a tech-assessment base repo),
      insomnia-plugin-repo-sync-3, webhook-store-cli, flow-boilerplate, plus forks of nestjs-query, ogma and
      serverless-bundle.
    - The 300-page docs index at https://docs.dotfile.com/llms.txt contains no SDK, client-library or install
      page. Dotfile's own guidance is to call the REST API directly with curl, or explore it in Postman or
      Insomnia.
  Consequence: NO `type: SDKs` pointer is emitted in apis.yml. An agent or engineer integrating Dotfile writes
  the HTTP client themselves.
