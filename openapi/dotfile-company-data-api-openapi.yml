openapi: 3.2.0
info:
  title: ⚙️ API specifications Company data API
  description: Dotfile public API documentation
  version: v1
  contact: {}
servers:
- url: https://api.dotfile.com
  description: Production environment
security:
- DotfileAPIKey: []
tags:
- name: Company data
paths:
  /v1/company-data/countries:
    get:
      operationId: company-data-countries
      summary: List countries
      description: 'List all available countries we support with vendor configured in your workspace settings


        ---


        #### See also

        Learn more about Company data'
      parameters:
      - name: code
        required: false
        in: query
        description: "Search country by `code`  \n[ISO 3166-1 alpha-2](https://en.wikipedia.org/wiki/ISO_3166-1_alpha-2) country code (eg `FR`)"
        schema:
          minLength: 2
          maxLength: 2
          format: alpha-2
          type: string
      - name: vendor
        required: false
        in: query
        description: "Search country by `vendor`.  \nCould be `pappers`,`kompany`,`creditsafe`,`kyckr`,`companies_house`,`inpi`,`info_camere`,`transparenzregister`,`topograph`,`charity_commission`,`mod_finance` or `none`."
        schema:
          enum:
          - pappers
          - kompany
          - creditsafe
          - kyckr
          - companies_house
          - inpi
          - info_camere
          - transparenzregister
          - topograph
          - charity_commission
          - mod_finance
          - none
          type: string
      - name: include_none
        required: false
        in: query
        description: Include country with `vendor=none` in result.
        schema:
          default: false
          type: boolean
      responses:
        '200':
          description: 'Returns list of countries


            **ℹ️ Click to see full payload**'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CountryList'
        '400':
          description: "The request is either malformed or contain invalid parameters.\n\n\n  "
      tags:
      - Company data
  /v1/company-data/entity-legal-forms:
    get:
      operationId: company-data-entity-legal-forms
      summary: List entity legal forms
      description: 'List all available entity legal forms (ISO 20275) we support


        ---


        #### See also

        Learn more about Company data'
      parameters:
      - name: country
        required: false
        in: query
        description: "Search entity legal forms by country  \n[ISO 3166-1 alpha-2](https://en.wikipedia.org/wiki/ISO_3166-1_alpha-2) country code (eg `FR`)"
        schema:
          minLength: 2
          maxLength: 2
          format: alpha-2
          type: string
      - name: subdivision
        required: false
        in: query
        description: Search by subdivision
        schema:
          type: string
      responses:
        '200':
          description: 'Returns list of entity legal forms


            **ℹ️ Click to see full payload**'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntityLegalFormList'
        '400':
          description: "The request is either malformed or contain invalid parameters.\n\n\n  "
      tags:
      - Company data
  /v1/company-data/search:
    get:
      operationId: company-data-search
      summary: Search companies
      description: 'Search companies by name or registration number.


        ---


        #### See also

        Learn more about Company data'
      parameters:
      - name: country
        required: true
        in: query
        description: "Search companies in a `country`, always required  \n[ISO 3166-1 alpha-2](https://en.wikipedia.org/wiki/ISO_3166-1_alpha-2) country code (eg `FR`)"
        schema:
          minLength: 2
          maxLength: 2
          format: alpha-2
          type: string
      - name: name
        required: false
        in: query
        description: "Search companies by `name`.  \nIn addition to `country`, either `name` or `registration_number` is required."
        schema:
          type: string
      - name: registration_number
        required: false
        in: query
        description: "Search companies by `registration_number`.  \nIn addition to `country`, either `name` or `registration_number` is required."
        schema:
          type: string
      responses:
        '200':
          description: 'Returns list of companies which matching


            **ℹ️ Click to see full payload**'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanySearchList'
        '400':
          description: "The request is either malformed or contain invalid parameters.\n\n\n  "
      tags:
      - Company data
  /v1/company-data/fetch/{search_ref}:
    get:
      operationId: company-data-fetch
      summary: Fetch company data
      description: 'Use a `search_ref` from Search companies result to fetch company data.


        ---


        #### See also

        Learn more about Company data'
      parameters:
      - name: search_ref
        required: true
        in: path
        description: From a result of [Search companies](./company-data-search)
        schema:
          type: string
      responses:
        '200':
          description: 'Returns Company data


            **ℹ️ Click to see full payload**'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyData'
        '400':
          description: "The request is either malformed or contain invalid parameters.\n\n  - Limit reached. Contact us at support@dotfile.com to lift all limits.\n  "
      tags:
      - Company data
  /v1/company-data/available-documents:
    get:
      operationId: company-data-get-available-documents
      summary: List available documents for a given company
      description: 'Require either `company_id` OR `country` & `registration_number`


        ---


        #### See also

        Learn more about Company data'
      parameters:
      - name: country
        required: false
        in: query
        description: "Company country  \n[ISO 3166-1 alpha-2](https://en.wikipedia.org/wiki/ISO_3166-1_alpha-2) country code (eg `FR`)"
        schema:
          minLength: 2
          maxLength: 2
          format: alpha-2
          example: FR
          type: string
      - name: registration_number
        required: false
        in: query
        description: Company registration number
        schema:
          type: string
      - name: company_id
        required: false
        in: query
        description: Company id
        schema:
          type: string
      responses:
        '200':
          description: 'Return list of available documents to order for a company


            **ℹ️ Click to see full payload**'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvailableDocumentList'
        '400':
          description: "The request is either malformed or contain invalid parameters.\n\n\n  "
      tags:
      - Company data
  /v1/company-data/document-orders:
    post:
      operationId: company-data-document-order-create-one
      summary: Create a document order
      description: 'Create a document order for a company


        ---


        #### See also

        Learn more about Company data

        Learn more about Companies

        Learn more about Files'
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentOrderCreate'
      responses:
        '201':
          description: 'Document order has been created on the company


            **ℹ️ Click to see full payload**'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentOrder'
        '400':
          description: "The request is either malformed or contain invalid parameters.\n\n  - Make sure the body payload matches the expected schema\n  "
      tags:
      - Company data
components:
  schemas:
    CompanyBeneficialOwner:
      type: object
      properties:
        entity_type:
          type: string
          enum:
          - company
        name:
          type: string
        address:
          $ref: '#/components/schemas/Address'
        position:
          type:
          - string
          - 'null'
        registration_number:
          type:
          - string
          - 'null'
        tax_identification_number:
          type:
          - string
          - 'null'
        legal_form:
          type:
          - string
          - 'null'
        entity_legal_form:
          type:
          - string
          - 'null'
          description: '[ISO 20275](https://www.gleif.org/en/about-lei/iso-20275-entity-legal-forms-code-list) code (eg: `6CHY`)'
        entity_legal_form_label:
          type:
          - string
          - 'null'
          readOnly: true
          description: "Label in the origin country language of the [ISO 20275](https://www.gleif.org/en/about-lei/iso-20275-entity-legal-forms-code-list) code.  \nMay contains multiple labels separated with a comma `,` when the code is assigned to multiple label in different languages."
        country:
          type:
          - string
          - 'null'
          format: alpha-2
          minLength: 2
          maxLength: 2
          description: '[ISO 3166-1 alpha-2](https://en.wikipedia.org/wiki/ISO_3166-1_alpha-2) country code (eg `FR`)'
        ownership_percentage:
          type:
          - number
          - 'null'
          format: float
      required:
      - entity_type
      - name
      - address
      - position
      - registration_number
      - tax_identification_number
      - legal_form
      - entity_legal_form
      - entity_legal_form_label
      - country
      - ownership_percentage
    EntityLegalForm:
      type: object
      properties:
        code:
          type: string
          example: 8MEC
          description: '[ISO 20275](https://www.gleif.org/en/about-lei/iso-20275-entity-legal-forms-code-list) code (eg: `6CHY`)'
        country:
          type:
          - string
          - 'null'
          format: alpha-2
          minLength: 2
          maxLength: 2
          example: CA
          description: "`null` for legal entity form available to all countries  \n[ISO 3166-1 alpha-2](https://en.wikipedia.org/wiki/ISO_3166-1_alpha-2) country code (eg `FR`)"
        subdivision:
          type: string
          example: CA-NB
          description: Country subdivision
        label:
          type: string
          description: "Label in the origin country language of the [ISO 20275](https://www.gleif.org/en/about-lei/iso-20275-entity-legal-forms-code-list) code.  \nMay contains multiple labels separated with a comma `,` when the code is assigned to multiple label in different languages."
        languages:
          type: object
          example:
            fr:
              label: Société à responsabilité limitée du Nouveau-Brunswick
              abbreviations: []
            en:
              label: New Brunswick limited liability partnership
              abbreviations:
              - LLP
      required:
      - code
      - country
      - label
      - languages
    CompanySearchList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/CompanySearch'
      required:
      - data
    CountryList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Country'
      required:
      - data
    Country:
      type: object
      properties:
        code:
          type: string
          format: alpha-2
          minLength: 2
          maxLength: 2
          example: FR
          description: '[ISO 3166-1 alpha-2](https://en.wikipedia.org/wiki/ISO_3166-1_alpha-2) country code (eg `FR`)'
        name:
          type: string
          example: France
        localName:
          type: string
          example: France
        emoji:
          type: string
          example: 🇫🇷
        emojiCode:
          type: string
          example: 1F1EB 1F1F7
        vendor:
          type: string
          enum:
          - pappers
          - kompany
          - creditsafe
          - kyckr
          - companies_house
          - inpi
          - info_camere
          - transparenzregister
          - topograph
          - charity_commission
          - mod_finance
          - none
          example: pappers
      required:
      - code
      - name
      - localName
      - emoji
      - emojiCode
      - vendor
    MergedIndividualRelation:
      type: object
      properties:
        voting_rights_percentage:
          type:
          - number
          - 'null'
          format: float
        ownership_percentage:
          type:
          - number
          - 'null'
          format: float
        roles:
          type: array
          description: '`legal_representative` `shareholder`'
          items:
            type: string
            enum:
            - legal_representative
            - shareholder
        position:
          type:
          - string
          - 'null'
      required:
      - voting_rights_percentage
      - ownership_percentage
      - roles
      - position
