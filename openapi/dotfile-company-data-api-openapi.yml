        maiden_name:
          type:
          - string
          - 'null'
        birth_date:
          type:
          - string
          - 'null'
          format: date
          description: Date in format [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601)(`yyyy-MM-dd` eg `2023-01-31`)
        birth_country:
          type:
          - string
          - 'null'
          format: alpha-2
          minLength: 2
          maxLength: 2
          description: '[ISO 3166-1 alpha-2](https://en.wikipedia.org/wiki/ISO_3166-1_alpha-2) country code (eg `FR`)'
        birth_place:
          type:
          - string
          - 'null'
        tax_identification_number:
          type:
          - string
          - 'null'
        voting_rights_percentage:
          type:
          - number
          - 'null'
          format: float
        roles:
          type: array
          description: '`legal_representative` `shareholder`'
          items:
            type: string
            enum:
            - legal_representative
            - shareholder
        ownership_percentage:
          type:
          - number
          - 'null'
          format: float
        is_beneficial_owner:
          type: boolean
        is_business_contact:
          type: boolean
        gender:
          type:
          - string
          - 'null'
          enum:
          - male
          - female
          - other
          description: Gender of the individual (`male`, `female`, `other`)
        nationalities:
          description: Nationalities as ISO 3166-1 alpha-2 country codes
          type:
          - array
          - 'null'
          items:
            type: string
        relations:
          type: array
          items:
            $ref: '#/components/schemas/MergedIndividualRelation'
      required:
      - address
      - position
      - first_name
      - middle_name
      - last_name
      - maiden_name
      - birth_date
      - birth_country
      - birth_place
      - tax_identification_number
      - voting_rights_percentage
      - roles
      - ownership_percentage
      - is_beneficial_owner
      - is_business_contact
      - gender
      - nationalities
      - relations
    CompanySearch:
      type: object
      properties:
        country:
          type: string
          format: alpha-2
          minLength: 2
          maxLength: 2
          description: '[ISO 3166-1 alpha-2](https://en.wikipedia.org/wiki/ISO_3166-1_alpha-2) country code (eg `FR`)'
        name:
          type: string
        search_ref:
          type: string
