          - user__mark_as_uncompleted__case_control
          - system__mark_as_uncompleted__case_control
        author_type:
          type: string
          enum:
          - api
          - user
          - system
          - contact
        author_id:
          type:
          - string
          - 'null'
          format: uuid
          description: Depending on author_type, could be either a user_id (user), an api_key_id (api), template_id (system) or individual_id (contact)
        user:
          description: Defined if author_type is user, otherwise null
          allOf:
          - $ref: '#/components/schemas/NestedUser'
        context:
          $ref: '#/components/schemas/ActivityContext'
        changes:
          description: 'EXPERIMENTAL: this data structure will evolve in the future'
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ActivityChange'
        created_at:
          type: string
          format: date-time
          description: "Creation date  \nDate time in format [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) (`yyyy-MM-ddTHH:mm:ss.S+X` eg `2023-01-31T13:30:00.000Z`)"
      required:
      - id
      - case_id
      - individual_id
      - company_id
      - type
      - author_type
      - author_id
      - user
      - context
      - changes
      - created_at
    NestedUser:
      type: object
      properties:
        id:
          type: string
          format: uuid
        first_name:
          type: string
        last_name:
          type: string
        email:
          type: string
          format: email
      required:
      - id
      - first_name
      - last_name
      - email
    ActivityRiskContext:
      type: object
      properties:
        id:
          type: string
          format: uuid
        level:
          type: string
          enum:
          - not_defined
          - low
          - medium
          - high
          - critical
          - prohibited
        mode:
          type: string
          enum:
          - automatic
          - manual
        comment:
          type:
          - string
          - 'null'
      required:
      - id
      - level
      - mode
      - comment
    ActivityChange:
      type: object
      properties:
        name:
          type: string
        previous:
          oneOf:
          - type: string
            title: string
          - type: boolean
            title: boolean
          - type: number
            title: number
        next:
          oneOf:
          - type: string
            title: string
          - type: boolean
            title: boolean
          - type: number
            title: number
      required:
      - name
      - previous
      - next
  securitySchemes:
    DotfileAPIKey:
      type: apiKey
      in: header
      name: X-DOTFILE-API-KEY
      description: Configure your api key in the Workspace settings
