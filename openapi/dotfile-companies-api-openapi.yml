openapi: 3.2.0
info:
  title: ⚙️ API specifications Companies API
  description: Dotfile public API documentation
  version: v1
  contact: {}
servers:
- url: https://api.dotfile.com
  description: Production environment
security:
- DotfileAPIKey: []
tags:
- name: Companies
paths:
  /v1/companies:
    get:
      operationId: company-get-many
      summary: List all companies
      description: 'Returns a list of all companies created in your Dotfile workspace.


        ---


        #### See also

        Learn more about Filtering, Sorting and Pagination'
      parameters:
      - name: name
        required: false
        in: query
        description: "Filter items by the `name.{operator}` field.  \nYou can use the `eq`, `not_eq`, `like` and `ilike` operators, the `eq` operator being the default."
        schema:
          type: string
      - name: registration_number
        required: false
        in: query
        description: "Filter items by the `registration_number.{operator}` field.  \nYou can use the `eq`, `not_eq`, `like` and `ilike` operators, the `eq` operator being the default."
        schema:
          type: string
      - name: country
        required: false
        in: query
        description: "Filter items by the `country.{operator}` field.  \nYou can use the `eq` operators, the `eq` operator being the default."
        schema:
          type: string
      - name: created_at
        required: false
        in: query
        description: "Filter items by the `created_at.{operator}` field.  \nYou can use the `eq`, `not_eq`, `gt`, `gte`, `lt` and `lte` operators, the `eq` operator being the default."
        schema:
          type: string
          pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}(T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]{1,3})?(Z|([0-9]{2}:[0-9]{2}))?)?$
          example:
          - '2023-01-31'
          - '2023-01-31T13:30:00Z'
          - '2023-01-31T13:30:00.000Z'
          description: Date (`yyyy-MM-dd` eg `2023-01-31`) or date time (`yyyy-MM-ddTHH:mm:ss.S+X` eg `2023-01-31T13:30:00.000Z`) in format [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601)
      - name: updated_at
        required: false
        in: query
        description: "Filter items by the `updated_at.{operator}` field.  \nYou can use the `eq`, `not_eq`, `gt`, `gte`, `lt` and `lte` operators, the `eq` operator being the default."
        schema:
          type: string
          pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}(T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]{1,3})?(Z|([0-9]{2}:[0-9]{2}))?)?$
          example:
          - '2023-01-31'
          - '2023-01-31T13:30:00Z'
          - '2023-01-31T13:30:00.000Z'
          description: Date (`yyyy-MM-dd` eg `2023-01-31`) or date time (`yyyy-MM-ddTHH:mm:ss.S+X` eg `2023-01-31T13:30:00.000Z`) in format [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601)
      - name: last_activity_at
        required: false
        in: query
        description: "Filter items by the `last_activity_at.{operator}` field.  \nYou can use the `eq`, `not_eq`, `gt`, `gte`, `lt` and `lte` operators, the `eq` operator being the default."
        schema:
          type: string
          pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}(T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]{1,3})?(Z|([0-9]{2}:[0-9]{2}))?)?$
          example:
          - '2023-01-31'
          - '2023-01-31T13:30:00Z'
          - '2023-01-31T13:30:00.000Z'
          description: Date (`yyyy-MM-dd` eg `2023-01-31`) or date time (`yyyy-MM-ddTHH:mm:ss.S+X` eg `2023-01-31T13:30:00.000Z`) in format [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601)
      - name: sort
        required: false
        in: query
        description: "Use this parameter to sort query results.  \nIf not specified, sorted in _ascending_ order with values of field `created_at`.  \nAvailable fields are `created_at`, `last_activity_at` and `name`."
        schema:
          default: created_at
          type: string
        examples:
          created_at:
            summary: Sort by values of the "created_at" field in ascending order
            value: created_at
          last_activity_at:
            summary: Sort by values of the "last_activity_at" field in descending order
            value: last_activity_at.desc
          name:
            summary: Sort by values of the "name" field in ascending order
            value: name
          multiple:
            summary: Sort by values of multiple fields
            value: created_at,last_activity_at.desc
      - name: page
        required: false
        in: query
        description: "Query response is paginated.  \nUse this parameter to choose which page you want to display.  \nPage index starts at 1 (the default)."
        schema:
          default: 1
          type: number
          minimum: 1
      - name: limit
        required: false
        in: query
        description: "Query response is paginated.  \nUse this parameter to choose the number of items per page.  \nLimit defaults to 20, maximum value is 100."
        schema:
          type: number
          default: 20
          minimum: 1
          maximum: 100
      responses:
        '200':
          description: 'List of companies created in the workspace


            **ℹ️ Click to see full payload**'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCompanyList'
        '400':
          description: "The request is either malformed or contain invalid parameters.\n\n  - One or multiple filtering parameters might be malformed. Make sure to use a supported operator and value for each filter.\n  - If specified, make sure the value of the `page` or `limit` query parameter are valid.\n  - Value of the `sort` parameter is invalid. Make sure the field name is supported, the sorting order is correctly specified, and a same field is not used multiple times for sorting.\n  "
      tags:
      - Companies
    post:
      operationId: company-create-one
      summary: Create a company
      description: Create a company in a case.
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompanyCreate'
      responses:
        '201':
          description: 'Company has been created in the case


            **ℹ️ Click to see full payload**'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Company'
        '400':
          description: "The request is either malformed or contain invalid parameters.\n\n  - Make sure the body payload matches the expected schema\n  - A case can have only one `main` company\n  - A case must have a `main` company before creating an `affiliated` company\n  "
        '404':
          description: No case can be found.
      tags:
      - Companies
  /v1/companies/{id}:
    get:
      operationId: company-get-one
      summary: Retrieve a company
      description: Retrieves the company with the given ID.
      parameters:
      - name: id
        required: true
        in: path
        description: Id of the company
        schema:
          format: uuid
          type: string
      - name: exclude_internal_checks
        required: false
        in: query
        description: Exclude checks that are marked as internal
        schema:
          default: false
          type: boolean
      - name: data_lineage
        required: false
        in: query
        description: Include data lineage in the response, default `false`
        schema:
          default: false
          type: boolean
      responses:
        '200':
          description: 'Returns information of a company


            **ℹ️ Click to see full payload**'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Company'
        '400':
          description: "The request is either malformed or contain invalid parameters.\n\n  - Make sure the identifier specified in the URL is a valid UUID\n  "
        '404':
          description: No company can be found.
      tags:
      - Companies
    patch:
      operationId: company-update-one
      summary: Update a company
      description: Updates the company with the given ID.
      parameters:
      - name: id
        required: true
        in: path
        description: Id of the company
        schema:
          format: uuid
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompanyUpdate'
      responses:
        '200':
          description: 'Returns information of the updated company


            **ℹ️ Click to see full payload**'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Company'
        '400':
          description: "The request is either malformed or contain invalid parameters.\n\n  - Make sure the identifier specified in the URL is a valid UUID\n  - Make sure the body payload matches the expected schema\n  "
        '404':
          description: No company can be found.
      tags:
      - Companies
    delete:
      operationId: company-delete-one
      summary: Delete a company
      description: Delete the specified company.
      parameters:
      - name: id
        required: true
        in: path
        description: Id of the company
        schema:
          format: uuid
          type: string
      responses:
        '204':
          description: ''
        '400':
          description: "The request is either malformed or contain invalid parameters.\n\n  - Make sure the identifier specified in the URL is a valid UUID\n  "
        '404':
          description: No company can be found.
      tags:
      - Companies
  /v1/companies/{id}/vendor-data:
    get:
      operationId: company-get-one-vendor-data
      summary: Retrieve a company vendor data
      description: 'Retrieves a company vendor data with the given the company ID.


        ---


        #### See also

        Learn more about Filtering, Sorting and Pagination'
      parameters:
      - name: id
        required: true
        in: path
        description: Id of the company
        schema:
          format: uuid
          type: string
      - name: name
        required: false
        in: query
        description: "Filter items by the `name.{operator}` field.  \nYou can use the `eq` and `not_eq` operators, the `eq` operator being the default."
        schema:
          type: string
          enum:
          - pappers
          - kompany
          - creditsafe
          - kyckr
          - companies_house
          - inpi
          - info_camere
          - transparenzregister
          - topograph
          - charity_commission
          - mod_finance
      - name: fetched_at
        required: false
        in: query
        description: "Filter items by the `fetched_at.{operator}` field.  \nYou can use the `eq`, `not_eq`, `gt`, `gte`, `lt` and `lte` operators, the `eq` operator being the default."
        schema:
          type: string
          pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}(T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]{1,3})?(Z|([0-9]{2}:[0-9]{2}))?)?$
          example:
          - '2023-01-31'
          - '2023-01-31T13:30:00Z'
          - '2023-01-31T13:30:00.000Z'
          description: Date (`yyyy-MM-dd` eg `2023-01-31`) or date time (`yyyy-MM-ddTHH:mm:ss.S+X` eg `2023-01-31T13:30:00.000Z`) in format [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601)
      - name: sort
        required: false
        in: query
        description: "Use this parameter to sort query results.  \nIf not specified, sorted in _ascending_ order with values of field `fetched_at`.  \nAvailable fields are `fetched_at` and `name`."
        schema:
          default: fetched_at
          type: string
        examples:
          fetched_at:
            summary: Sort by values of the "fetched_at" field in ascending order
            value: fetched_at
          name:
            summary: Sort by values of the "name" field in descending order
            value: name.desc
          multiple:
            summary: Sort by values of multiple fields
            value: fetched_at,name.desc
      - name: page
        required: false
        in: query
        description: "Query response is paginated.  \nUse this parameter to choose which page you want to display.  \nPage index starts at 1 (the default)."
        schema:
          default: 1
          type: number
          minimum: 1
      - name: limit
        required: false
        in: query
        description: "Query response is paginated.  \nUse this parameter to choose the number of items per page.  \nLimit defaults to 20, maximum value is 100."
        schema:
          type: number
          default: 20
          minimum: 1
          maximum: 100
      responses:
        '200':
          description: 'List of vendor data of the company


            **ℹ️ Click to see full payload**'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyVendorDataList'
        '400':
          description: "The request is either malformed or contain invalid parameters.\n\n  - Make sure the identifier specified in the URL is a valid UUID\n  "
        '404':
          description: No company can be found.
      tags:
      - Companies
  /v1/companies/{id}/set-relevant:
    post:
      operationId: company-set-relevant
      summary: Set company relevance
      description: Change the relevance of the specified company
      parameters:
      - name: id
        required: true
        in: path
        description: Id of the company
        schema:
          format: uuid
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompanySetRelevant'
      responses:
        '200':
          description: '**ℹ️ Click to see full payload**'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Company'
        '400':
          description: "The request is either malformed or contain invalid parameters.\n\n  - Make sure the identifier specified in the URL is a valid UUID\n  - Make sure the company is an affiliated company\n  "
        '404':
          description: No company can be found.
      tags:
      - Companies
components:
  schemas:
    CompanyUpdate:
      type: object
      properties:
        name:
          type: string
          description: Name for the company (at most 160 characters).
          maxLength: 160
          minLength: 1
        commercial_name:
          type:
          - string
          - 'null'
          description: Commercial name for the company (at most 160 characters).
          maxLength: 160
          minLength: 1
        registration_number:
          type:
          - string
          - 'null'
        registration_date:
          type:
          - string
          - 'null'
          format: date
          description: Date in format [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601)(`yyyy-MM-dd` eg `2023-01-31`)
        status:
          type: string
          enum:
          - live
          - closed
          - not_reported
          default: not_reported
        legal_form:
          type:
          - string
          - 'null'
        entity_legal_form:
          type:
          - string
          - 'null'
          description: '[ISO 20275](https://www.gleif.org/en/about-lei/iso-20275-entity-legal-forms-code-list) code (eg: `6CHY`)'
        country:
          type:
          - string
          - 'null'
          format: alpha-2
          minLength: 2
          maxLength: 2
          description: '[ISO 3166-1 alpha-2](https://en.wikipedia.org/wiki/ISO_3166-1_alpha-2) country code (eg `FR`)'
        address:
          default: {}
          allOf:
          - $ref: '#/components/schemas/PartialAddress'
        classifications:
          default: []
          type: array
          items:
            $ref: '#/components/schemas/CompanyClassification'
        banking_information:
          $ref: '#/components/schemas/BankingInformation'
        share_capital:
          type:
          - string
          - 'null'
        tax_identification_number:
          type:
          - string
          - 'null'
        website_url:
          type:
          - string
          - 'null'
        employer_identification_number:
          type:
          - string
          - 'null'
        custom_properties:
          type: object
          description: "Optional partial custom properties object in a format of `key` (string) / `value` (string | boolean | string[] | number | null) to update the company.  \n\nArchived custom properties are not accepted."
          additionalProperties:
            oneOf:
            - type:
              - string
              - 'null'
              description: "- For custom property `text`, maxLength depends on the settings `isMultiLine`. singleLine: maxLength=250, multiLine: maxLength=10000  \n\n- For custom property `email`, maxLength=250.  \n\n- For custom property `url`, maxLength=2000  \n\n- For custom property `date`, date in format [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) (`yyyy-MM-dd` eg `2023-01-31`)  \n\n- For custom property `phone_number`, phone number in [E.164](https://en.wikipedia.org/wiki/E.164) format (eg `+33123456789`)"
            - type:
              - boolean
              - 'null'
              description: For custom property `boolean`
            - type:
              - number
              - 'null'
              description: For custom property `numeric`, actual minimum and maximum will depend on the property settings but will be within -9007199254740991 and 9007199254740991
              minimum: -9007199254740991
              maximum: 9007199254740991
            - type:
              - array
              - 'null'
              description: "- For custom property `choices`, contains the `key` of the options  \n\n- For custom property `countries`, contains the [ISO 3166-1 alpha-2](https://en.wikipedia.org/wiki/ISO_3166-1_alpha-2) country code (eg `FR`)"
              items:
                type: string
            - description: To remove the value for this custom property on the company
          example:
            custom_text: Custom properties text
            custom_boolean: true
            custom_date: '2012-12-12'
            custom_countries:
            - FR
            custom_choices:
            - option1
            - option2
            custom_numeric: 12.3
            custom_property: null
    Pappers:
      type: object
      properties:
        id:
          type: string
          format: uuid
        company_id:
          type: string
          format: uuid
        name:
          type: string
          enum:
          - pappers
        raw:
          type: object
          description: For **Pappers**, see <https://www.pappers.fr/api/documentation#operation/entreprise>
          additionalProperties: true
        fetched_at:
          type: string
          format: date-time
          description: Date time in format [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) (`yyyy-MM-ddTHH:mm:ss.S+X` eg `2023-01-31T13:30:00.000Z`)
      required:
      - id
      - company_id
      - name
      - raw
      - fetched_at
    PaginatedCompanyList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/CompanyList'
        pagination:
          example:
            page: 1
            limit: 20
            count: 42
          allOf:
          - $ref: '#/components/schemas/Pagination'
      required:
      - data
      - pagination
    CompanyVendorDataList:
      type: object
      properties:
        data:
          discriminator:
            propertyName: name
          type: array
          items:
            oneOf:
            - $ref: '#/components/schemas/Pappers'
            - $ref: '#/components/schemas/Kompany'
            - $ref: '#/components/schemas/Creditsafe'
            - $ref: '#/components/schemas/Kyckr'
            - $ref: '#/components/schemas/Companieshouse'
            - $ref: '#/components/schemas/Inpi'
            - $ref: '#/components/schemas/Infocamere'
            - $ref: '#/components/schemas/Transparenzregister'
            - $ref: '#/components/schemas/Topograph'
            - $ref: '#/components/schemas/Charitycommission'
            - $ref: '#/components/schemas/Modfinance'
        pagination:
          example:
            page: 1
            limit: 20
            count: 42
          allOf:
          - $ref: '#/components/schemas/Pagination'
      required:
      - data
      - pagination
    PartialAddress:
      type: object
      properties:
        street_address:
          type:
          - string
          - 'null'
        street_address_2:
          type:
          - string
          - 'null'
        postal_code:
          type:
          - string
          - 'null'
        city:
          type:
          - string
          - 'null'
        state:
          type:
          - string
          - 'null'
        region:
          type:
          - string
          - 'null'
        country:
          type:
          - string
          - 'null'
          format: alpha-2
          minLength: 2
          maxLength: 2
          description: '[ISO 3166-1 alpha-2](https://en.wikipedia.org/wiki/ISO_3166-1_alpha-2) country code (eg `FR`)'
    DataLineage:
      type: object
      properties:
        current_value:
          oneOf:
          - type: string
          - type: number
          - type: boolean
          - type: array
            items: {}
          - type:
            - object
            - 'null'
            additionalProperties: true
          description: Current value of the property on the entity
        sources:
          description: Property sources
          type: array
          items:
            $ref: '#/components/schemas/DataLineageValueSource'
      required:
      - current_value
      - sources
    Modfinance:
      type: object
      properties:
        id:
          type: string
          format: uuid
        company_id:
          type: string
          format: uuid
        name:
          type: string
          enum:
          - mod_finance
        raw:
          type: object
          description: For **ModeFinance**, see <https://api.modefinancegate.com/en/doc/> (requires a ModeFinance account)
          additionalProperties: true
        fetched_at:
          type: string
          format: date-time
          description: Date time in format [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) (`yyyy-MM-ddTHH:mm:ss.S+X` eg `2023-01-31T13:30:00.000Z`)
      required:
      - id
      - company_id
      - name
      - raw
      - fetched_at
    Charitycommission:
      type: object
      properties:
        id:
          type: string
          format: uuid
        company_id:
          type: string
          format: uuid
        name:
          type: string
          enum:
          - charity_commission
        raw:
          type: object
          description: For **Charity Commission**, see <https://register-of-charities.charitycommission.gov.uk/en/documentation-on-the-api>
          additionalProperties: true
        fetched_at:
          type: string
          format: date-time
          description: Date time in format [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) (`yyyy-MM-ddTHH:mm:ss.S+X` eg `2023-01-31T13:30:00.000Z`)
      required:
      - id
      - company_id
      - name
      - raw
      - fetched_at
    Kyckr:
      type: object
      properties:
        id:
          type: string
          format: uuid
        company_id:
          type: string
          format: uuid
        name:
          type: string
          enum:
          - kyckr
        raw:
          type: object
          description: For **Kyckr**, see <https://developer.kyckr.com/api/#/>
          additionalProperties: true
        fetched_at:
          type: string
          format: date-time
          description: Date time in format [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) (`yyyy-MM-ddTHH:mm:ss.S+X` eg `2023-01-31T13:30:00.000Z`)
      required:
      - id
      - company_id
      - name
      - raw
      - fetched_at
    Companieshouse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        company_id:
          type: string
          format: uuid
        name:
          type: string
          enum:
          - companies_house
        raw:
          type: object
          description: For **Companies House**, see <https://developer.company-information.service.gov.uk/>
          additionalProperties: true
        fetched_at:
          type: string
          format: date-time
          description: Date time in format [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) (`yyyy-MM-ddTHH:mm:ss.S+X` eg `2023-01-31T13:30:00.000Z`)
      required:
      - id
      - company_id
      - name
      - raw
      - fetched_at
    Transparenzregister:
      type: object
      properties:
        id:
          type: string
          format: uuid
        company_id:
          type: string
          format: uuid
        name:
          type: string
          enum:
          - transparenzregister
        raw:
          type: object
          description: For **Transparenzregister**, see <https://api.transparenzregister.de/> (requires a Transparenzregister account)
          additionalProperties: true
        fetched_at:
          type: string
          format: date-time
          description: Date time in format [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) (`yyyy-MM-ddTHH:mm:ss.S+X` eg `2023-01-31T13:30:00.000Z`)
      required:
      - id
      - company_id
      - name
      - raw
      - fetched_at
    Company:
      type: object
      properties:
        id:
          type: string
          format: uuid
        case_id:
          type: string
          format: uuid
        type:
          type: string
          enum:
          - main
          - affiliated
        name:
          type: string
          maxLength: 160
        is_relevant:
          type: boolean
        commercial_name:
