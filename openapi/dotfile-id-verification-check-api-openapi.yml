        comment:
          type:
          - string
          - 'null'
        report_file_id:
          type:
          - string
          - 'null'
        name:
          type: string
          enum:
          - ubble
          - checkout
          - veriff
          - onfido
          - idnow
          default: idnow
      required:
      - verification_ref
      - verification_url
      - verification_status
      - started_at
      - ended_at
      - comment
      - report_file_id
      - name
    IdVerificationCheckDataUbbleVendor:
      type: object
      properties:
        verification_ref:
          type: string
        verification_url:
          type: string
          description: The URL has a 15 min validity
        verification_status:
          type: string
        started_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Date time in format [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) (`yyyy-MM-ddTHH:mm:ss.S+X` eg `2023-01-31T13:30:00.000Z`)
        ended_at:
          type:
          - string
