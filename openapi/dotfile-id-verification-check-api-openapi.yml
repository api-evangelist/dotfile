      - first_name
      - last_name
      - email
    IdVerificationCheckSettingsCreate:
      type: object
      properties:
        vendor:
          type: string
          enum:
          - ubble
          - checkout
          - veriff
          - onfido
          - idnow
          description: Vendor `ubble` is deprecated. Only for legacy configuration
        mode:
          type: string
          enum:
