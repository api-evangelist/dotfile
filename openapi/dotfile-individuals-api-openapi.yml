openapi: 3.2.0
info:
  title: ⚙️ API specifications Individuals API
  description: Dotfile public API documentation
  version: v1
  contact: {}
servers:
- url: https://api.dotfile.com
  description: Production environment
security:
- DotfileAPIKey: []
tags:
- name: Individuals
paths:
  /v1/individuals:
    get:
      operationId: individual-get-many
      summary: List all individuals
      description: 'Returns a list of all individuals created in your Dotfile workspace.


        ---


        #### See also

        Learn more about Filtering, Sorting and Pagination'
      parameters:
      - name: first_name
        required: false
        in: query
        description: "Filter items by the `first_name.{operator}` field.  \nYou can use the `eq`, `not_eq`, `like` and `ilike` operators, the `eq` operator being the default."
        schema:
          type: string
      - name: last_name
        required: false
        in: query
        description: "Filter items by the `last_name.{operator}` field.  \nYou can use the `eq`, `not_eq`, `like` and `ilike` operators, the `eq` operator being the default."
        schema:
          type: string
      - name: birth_date
        required: false
        in: query
        description: "Filter items by the `birth_date.{operator}` field.  \nYou can use the `eq` operators, the `eq` operator being the default."
        schema:
          type: string
          pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}(T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]{1,3})?(Z|([0-9]{2}:[0-9]{2}))?)?$
          example:
          - '2023-01-31'
          - '2023-01-31T13:30:00Z'
          - '2023-01-31T13:30:00.000Z'
          description: Date (`yyyy-MM-dd` eg `2023-01-31`) or date time (`yyyy-MM-ddTHH:mm:ss.S+X` eg `2023-01-31T13:30:00.000Z`) in format [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601)
      - name: email
        required: false
        in: query
        description: "Filter items by the `email.{operator}` field.  \nYou can use the `eq`, `not_eq`, `like` and `ilike` operators, the `eq` operator being the default."
        schema:
          type: string
      - name: created_at
        required: false
        in: query
        description: "Filter items by the `created_at.{operator}` field.  \nYou can use the `eq`, `not_eq`, `gt`, `gte`, `lt` and `lte` operators, the `eq` operator being the default."
        schema:
          type: string
          pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}(T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]{1,3})?(Z|([0-9]{2}:[0-9]{2}))?)?$
          example:
          - '2023-01-31'
          - '2023-01-31T13:30:00Z'
          - '2023-01-31T13:30:00.000Z'
          description: Date (`yyyy-MM-dd` eg `2023-01-31`) or date time (`yyyy-MM-ddTHH:mm:ss.S+X` eg `2023-01-31T13:30:00.000Z`) in format [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601)
      - name: updated_at
        required: false
        in: query
        description: "Filter items by the `updated_at.{operator}` field.  \nYou can use the `eq`, `not_eq`, `gt`, `gte`, `lt` and `lte` operators, the `eq` operator being the default."
        schema:
          type: string
          pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}(T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]{1,3})?(Z|([0-9]{2}:[0-9]{2}))?)?$
          example:
          - '2023-01-31'
          - '2023-01-31T13:30:00Z'
          - '2023-01-31T13:30:00.000Z'
          description: Date (`yyyy-MM-dd` eg `2023-01-31`) or date time (`yyyy-MM-ddTHH:mm:ss.S+X` eg `2023-01-31T13:30:00.000Z`) in format [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601)
      - name: last_activity_at
        required: false
        in: query
        description: "Filter items by the `last_activity_at.{operator}` field.  \nYou can use the `eq`, `not_eq`, `gt`, `gte`, `lt` and `lte` operators, the `eq` operator being the default."
        schema:
          type: string
          pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}(T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]{1,3})?(Z|([0-9]{2}:[0-9]{2}))?)?$
          example:
          - '2023-01-31'
          - '2023-01-31T13:30:00Z'
          - '2023-01-31T13:30:00.000Z'
          description: Date (`yyyy-MM-dd` eg `2023-01-31`) or date time (`yyyy-MM-ddTHH:mm:ss.S+X` eg `2023-01-31T13:30:00.000Z`) in format [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601)
      - name: sort
        required: false
        in: query
        description: "Use this parameter to sort query results.  \nIf not specified, sorted in _ascending_ order with values of field `created_at`.  \nAvailable fields are `created_at`, `first_name`, `last_activity_at` and `last_name`."
        schema:
          default: created_at
          type: string
        examples:
          created_at:
            summary: Sort by values of the "created_at" field in ascending order
            value: created_at
          first_name:
            summary: Sort by values of the "first_name" field in descending order
            value: first_name.desc
          last_activity_at:
            summary: Sort by values of the "last_activity_at" field in ascending order
            value: last_activity_at
          last_name:
            summary: Sort by values of the "last_name" field in descending order
            value: last_name.desc
          multiple:
            summary: Sort by values of multiple fields
            value: created_at,first_name.desc
      - name: page
        required: false
        in: query
        description: "Query response is paginated.  \nUse this parameter to choose which page you want to display.  \nPage index starts at 1 (the default)."
        schema:
          default: 1
          type: number
          minimum: 1
      - name: limit
        required: false
        in: query
        description: "Query response is paginated.  \nUse this parameter to choose the number of items per page.  \nLimit defaults to 20, maximum value is 100."
        schema:
          type: number
          default: 20
          minimum: 1
          maximum: 100
      responses:
        '200':
          description: 'List of individuals created in the workspace


            **ℹ️ Click to see full payload**'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedIndividualList'
        '400':
          description: "The request is either malformed or contain invalid parameters.\n\n  - One or multiple filtering parameters might be malformed. Make sure to use a supported operator and value for each filter.\n  - If specified, make sure the value of the `page` or `limit` query parameter are valid.\n  - Value of the `sort` parameter is invalid. Make sure the field name is supported, the sorting order is correctly specified, and a same field is not used multiple times for sorting.\n  "
      tags:
      - Individuals
    post:
      operationId: individual-create-one
      summary: Create an individual
      description: Create an individual in a case.
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IndividualCreate'
      responses:
        '201':
          description: 'Individual has been created in the case


            **ℹ️ Click to see full payload**'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Individual'
        '400':
          description: "The request is either malformed or contain invalid parameters.\n\n  - Make sure the body payload matches the expected schema\n  "
        '404':
          description: No case can be found.
      tags:
      - Individuals
  /v1/individuals/{id}:
    get:
      operationId: individual-get-one
      summary: Retrieve an individual
      description: Retrieves the individual with the given ID.
      parameters:
      - name: id
        required: true
        in: path
        description: Id of the individual
        schema:
          format: uuid
          type: string
      - name: exclude_internal_checks
        required: false
        in: query
        description: Exclude checks that are marked as internal
        schema:
          default: false
          type: boolean
      - name: data_lineage
        required: false
        in: query
        description: Include data lineage in the response, default `false`
        schema:
          default: false
          type: boolean
      responses:
        '200':
          description: 'Returns information of an individual


            **ℹ️ Click to see full payload**'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Individual'
        '400':
          description: "The request is either malformed or contain invalid parameters.\n\n  - Make sure the identifier specified in the URL is a valid UUID\n  "
        '404':
          description: No individual can be found.
      tags:
      - Individuals
    patch:
      operationId: individual-update-one
      summary: Update an individual
      description: Updates the individual with the given ID.
      parameters:
      - name: id
        required: true
        in: path
        description: Id of the individual
        schema:
          format: uuid
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IndividualUpdate'
      responses:
        '200':
          description: 'Returns information of the updated individual


            **ℹ️ Click to see full payload**'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Individual'
        '400':
          description: "The request is either malformed or contain invalid parameters.\n\n  - Make sure the identifier specified in the URL is a valid UUID\n  - Make sure the body payload matches the expected schema\n  "
        '404':
          description: No individual can be found.
      tags:
      - Individuals
    delete:
      operationId: individual-delete-one
      summary: Delete an individual
      description: Delete the specified individual.
      parameters:
      - name: id
        required: true
        in: path
        description: Id of the individual
        schema:
          format: uuid
          type: string
      responses:
        '204':
          description: ''
        '400':
          description: "The request is either malformed or contain invalid parameters.\n\n  - Make sure the identifier specified in the URL is a valid UUID\n  "
        '404':
          description: No individual can be found.
      tags:
      - Individuals
  /v1/individuals/{id}/set-relevant:
    post:
      operationId: individual-set-relevant
      summary: Set individual relevance
      description: Change the relevance of the specified individual
      parameters:
      - name: id
        required: true
        in: path
        description: Id of the individual
        schema:
          format: uuid
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IndividualSetRelevant'
      responses:
        '200':
          description: '**ℹ️ Click to see full payload**'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Individual'
        '400':
          description: "The request is either malformed or contain invalid parameters.\n\n  - Make sure the identifier specified in the URL is a valid UUID\n  "
        '404':
          description: No individual can be found.
      tags:
      - Individuals
components:
  schemas:
    IndividualUpdate:
      type: object
      properties:
        first_name:
          type: string
        middle_name:
          type:
          - string
          - 'null'
          description: May contain multiple middle names
        last_name:
          type: string
        maiden_name:
          type:
          - string
          - 'null'
        is_business_contact:
          type: boolean
          default: false
          description: Set to `true` if this individual should be contacted regarding the case, this will also make the `email` required.
        is_beneficial_owner:
          type: boolean
          default: false
          description: Set to true if this individual ultimately owns or controls the main company
        is_controlling_person:
          type: boolean
          default: false
          description: Set to true if this individual exercises control over the main company through means other than ownership (e.g. senior management, board member)
        is_delegator:
          type: boolean
          default: false
          description: "Set to true if this individual is delegating its signing authority to the signatory of the case.  \nIndividual cannot be both delegator and signatory \nNot relevant individual cannot be delegator"
        is_signatory:
          type: boolean
          default: false
          description: "Set to true if this person has delegated authority to be a signatory of the case, this will also make the `email` required.  \nIndividual cannot be both signatory and delegator \nNot relevant individual cannot be signatory"
        email:
          type:
          - string
          - 'null'
          description: "Required if individual `is_business_contact` is `true`. \nMust be a valid email as defined in the [HTML spec](https://html.spec.whatwg.org/multipage/input.html#valid-e-mail-address) (eg. must match the following JavaScript-compatible regular expression: ```/^[a-zA-Z0-9.!#$%&'*+\\/=?^_`{|}~-]+@[a-zA-Z0-9](?:[a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?(?:\\.[a-zA-Z0-9](?:[a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?)*$/```)"
          format: email
        birth_date:
          type:
          - string
          - 'null'
          format: date
          description: Date in format [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601)(`yyyy-MM-dd` eg `2023-01-31`)
        birth_country:
          type:
          - string
          - 'null'
          format: alpha-2
          minLength: 2
          maxLength: 2
          description: '[ISO 3166-1 alpha-2](https://en.wikipedia.org/wiki/ISO_3166-1_alpha-2) country code (eg `FR`)'
        birth_place:
          type:
          - string
          - 'null'
        gender:
          type:
          - string
          - 'null'
          enum:
          - male
          - female
          - other
          description: Gender of the individual
        nationalities:
          description: Nationalities of the individual as ISO 3166-1 alpha-2 country codes
          type:
          - array
          - 'null'
          items:
            type: string
        address:
          default: {}
          allOf:
          - $ref: '#/components/schemas/PartialAddress'
        banking_information:
          allOf:
          - $ref: '#/components/schemas/BankingInformation'
        tax_identification_number:
          type:
          - string
          - 'null'
        social_security_number:
          type:
          - string
          - 'null'
        phone_number:
          type:
          - string
          - 'null'
          format: e.164
          minLength: 10
          maxLength: 15
          example: '+33601234567'
          description: '[E.164](https://en.wikipedia.org/wiki/E.164) phoneNumber (eg `+XXXXXXXXXXX`)'
        position:
          type:
          - string
          - 'null'
        ownership_percentage:
          type:
          - number
          - 'null'
          minimum: 0
          maximum: 100
        voting_rights_percentage:
          type:
          - number
          - 'null'
          minimum: 0
          maximum: 100
        roles:
          type: array
          description: '`legal_representative` `shareholder`'
          items:
            type: string
            enum:
            - legal_representative
            - shareholder
        custom_properties:
          type: object
          description: "Optional partial custom properties object in a format of `key` (string) / `value` (string | boolean | string[] | number | null) to update the individual.  \n\nArchived custom properties are not accepted."
          additionalProperties:
            oneOf:
            - type:
              - string
              - 'null'
              description: "- For custom property `text`, maxLength depends on the settings `isMultiLine`. singleLine: maxLength=250, multiLine: maxLength=10000  \n\n- For custom property `email`, maxLength=250.  \n\n- For custom property `url`, maxLength=2000  \n\n- For custom property `date`, date in format [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) (`yyyy-MM-dd` eg `2023-01-31`)  \n\n- For custom property `phone_number`, phone number in [E.164](https://en.wikipedia.org/wiki/E.164) format (eg `+33123456789`)"
            - type:
              - boolean
              - 'null'
              description: For custom property `boolean`
            - type:
              - number
              - 'null'
              description: For custom property `numeric`, actual minimum and maximum will depend on the property settings but will be within -9007199254740991 and 9007199254740991
              minimum: -9007199254740991
              maximum: 9007199254740991
            - type:
              - array
              - 'null'
              description: "- For custom property `choices`, contains the `key` of the options  \n\n- For custom property `countries`, contains the [ISO 3166-1 alpha-2](https://en.wikipedia.org/wiki/ISO_3166-1_alpha-2) country code (eg `FR`)"
              items:
                type: string
            - description: To remove the value for this custom property on the individual
          example:
            custom_text: Custom properties text
            custom_boolean: true
            custom_date: '2012-12-12'
            custom_countries:
            - FR
            custom_choices:
            - option1
            - option2
            custom_numeric: 12.3
            custom_property: null
    CaseRelationCreateImplicitTarget:
      type: object
      properties:
        to_company_id:
          type: string
          format: uuid
          description: When omitted, will default to the `main` company of the case
        voting_rights_percentage:
          type:
          - number
          - 'null'
          format: float
          minimum: 0
          maximum: 100
        ownership_percentage:
          type:
          - number
          - 'null'
          format: float
          minimum: 0
          maximum: 100
        roles:
          type: array
          description: '`legal_representative` `shareholder`'
          items:
            type: string
            enum:
            - legal_representative
            - shareholder
        position:
          type:
          - string
          - 'null'
    Pagination:
      type: object
      properties:
        page:
          type: number
          description: Current page number (defined in query parameter)
          default: 1
        limit:
          type: number
          description: Item count per page (defined in query parameter)
          default: 20
        count:
          type: number
          description: Total items count
          example: 42
      required:
      - page
      - limit
      - count
    Individual:
      type: object
      properties:
        id:
          type: string
          format: uuid
        case_id:
          type: string
          format: uuid
        roles:
          type: array
          description: '`legal_representative` `shareholder`'
          items:
            type: string
            enum:
            - legal_representative
            - shareholder
        is_beneficial_owner:
          type: boolean
          description: Set to true if this individual ultimately owns or controls the main company
        is_controlling_person:
          type: boolean
          description: Set to true if this individual exercises control over the main company through means other than ownership (e.g. senior management, board member)
        is_business_contact:
          type: boolean
          description: Set to true if this individual should be contacted regarding the case
        is_delegator:
          type: boolean
          description: Set to true if this individual is delegating its signing authority to the signatory of the case
        is_signatory:
          type: boolean
          description: Set to true if this person has delegated authority to be a signatory of the case
        is_relevant:
          type: boolean
        first_name:
          type: string
        middle_name:
          type:
          - string
          - 'null'
          description: May contain multiple middle names
        last_name:
          type: string
        maiden_name:
          type:
          - string
          - 'null'
        email:
          type:
          - string
          - 'null'
          format: email
        birth_date:
          type:
          - string
          - 'null'
          format: date
          description: Date in format [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601)(`yyyy-MM-dd` eg `2023-01-31`)
        birth_country:
          type:
          - string
          - 'null'
          format: alpha-2
          minLength: 2
          maxLength: 2
          description: '[ISO 3166-1 alpha-2](https://en.wikipedia.org/wiki/ISO_3166-1_alpha-2) country code (eg `FR`)'
        birth_place:
          type:
          - string
          - 'null'
        gender:
          type:
          - string
          - 'null'
          enum:
          - male
          - female
          - other
          description: Gender of the individual
        nationalities:
          description: Nationalities of the individual as ISO 3166-1 alpha-2 country codes
          type:
          - array
          - 'null'
          items:
            type: string
        address:
          $ref: '#/components/schemas/Address'
        banking_information:
          allOf:
          - $ref: '#/components/schemas/BankingInformation'
        tax_identification_number:
          type:
          - string
          - 'null'
        social_security_number:
          type:
          - string
          - 'null'
        phone_number:
          type:
          - string
          - 'null'
          format: e.164
          minLength: 10
          maxLength: 15
          example: '+33601234567'
          description: "Phone number in [E.164](https://en.wikipedia.org/wiki/E.164) format (eg `+33123456789`)  \n[E.164](https://en.wikipedia.org/wiki/E.164) phoneNumber (eg `+XXXXXXXXXXX`)"
        position:
          type:
          - string
          - 'null'
        ownership_percentage:
          type:
          - number
          - 'null'
          format: float
        voting_rights_percentage:
          type:
          - number
          - 'null'
          format: float
        custom_properties:
          type: object
          description: "Custom properties object in a format of `key` (string) / `value` (string | boolean | string[] | number | null) to read the individual.  \n\nArchived custom properties are omitted."
          additionalProperties:
            oneOf:
            - type:
              - string
              - 'null'
              description: "- For custom property `text`, maxLength depends on the settings `isMultiLine`. singleLine: maxLength=250, multiLine: maxLength=10000  \n\n- For custom property `email`, maxLength=250.  \n\n- For custom property `url`, maxLength=2000  \n\n- For custom property `date`, date in format [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) (`yyyy-MM-dd` eg `2023-01-31`)  \n\n- For custom property `phone_number`, phone number in [E.164](https://en.wikipedia.org/wiki/E.164) format (eg `+33123456789`)"
            - type:
              - boolean
              - 'null'
              description: For custom property `boolean`
            - type:
              - number
              - 'null'
              description: For custom property `numeric`, actual minimum and maximum will depend on the property settings but will be within -9007199254740991 and 9007199254740991
              minimum: -9007199254740991
              maximum: 9007199254740991
            - type:
              - array
              - 'null'
              description: "- For custom property `choices`, contains the `key` of the options  \n\n- For custom property `countries`, contains the [ISO 3166-1 alpha-2](https://en.wikipedia.org/wiki/ISO_3166-1_alpha-2) country code (eg `FR`)"
              items:
                type: string
            - description: When there are no value for this custom property on the individual
          example:
            custom_text: Custom properties text
            custom_boolean: true
            custom_date: '2012-12-12'
            custom_countries:
            - FR
            custom_choices:
            - option1
            - option2
            custom_numeric: 12.3
            custom_property: null
        checks:
          type: array
          items:
            $ref: '#/components/schemas/Check'
        relations:
          type: array
          items:
            $ref: '#/components/schemas/CaseRelationOfEntity'
        created_at:
          type: string
          format: date-time
          description: "Creation date  \nDate time in format [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) (`yyyy-MM-ddTHH:mm:ss.S+X` eg `2023-01-31T13:30:00.000Z`)"
        updated_at:
          type: string
          format: date-time
          description: "Latest update date  \nDate time in format [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) (`yyyy-MM-ddTHH:mm:ss.S+X` eg `2023-01-31T13:30:00.000Z`)"
        last_activity_at:
          type: string
          format: date-time
          description: "Latest activity date  \nDate time in format [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) (`yyyy-MM-ddTHH:mm:ss.S+X` eg `2023-01-31T13:30:00.000Z`)"
        data_lineage:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/DataLineage'
          description: Data lineage keyed by property path, returned only when `data_lineage=true` is provided.
      required:
      - id
      - case_id
      - roles
      - is_beneficial_owner
      - is_controlling_person
      - is_business_contact
      - is_delegator
      - is_signatory
      - is_relevant
      - first_name
      - middle_name
      - last_name
      - maiden_name
      - email
      - birth_date
      - birth_country
      - birth_place
      - gender
      - nationalities
      - address
      - banking_information
      - tax_identification_number
      - social_security_number
      - phone_number
      - position
      - ownership_percentage
      - voting_rights_percentage
      - custom_properties
      - checks
      - relations
      - created_at
      - updated_at
      - last_activity_at
    Address:
      type: object
      properties:
        street_address:
          type:
