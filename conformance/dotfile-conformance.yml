regulatory_context:
  note: >-
    Dotfile is compliance infrastructure, so the regimes below are what its CUSTOMERS are subject to and what
    Dotfile's checks are built to satisfy — they are not certifications Dotfile itself holds. Recorded because
    they explain the product surface, and are named in Dotfile's own guides.
  regimes:
  - AMLA / EU AML package
  - PSD2 and PSD3 (KYB for payment service providers)
  - MiCA (crypto-asset service providers)
  - DORA
  - UK Companies House / PSC beneficial-ownership rules
  - US GENIUS Act (stablecoin issuers)
  - eIDAS (electronic signature)
  - BaFin-certified video identification (via IDnow VideoIdent)
  sources:
  - https://docs.dotfile.com/llms.txt
  - https://www.dotfile.com/resources
verification_vendors:
  note: >-
    Dotfile orchestrates third-party verification vendors. Named in its own docs, these are the upstream data
    and IDV providers a Dotfile workspace can be configured against.
  vendors: [Veriff, IDnow, Onfido, Checkout (formerly Ubble), ComplyAdvantage, LSEG World-Check, Creditsafe, Kyckr, INPI, GBG, Trustfull]
