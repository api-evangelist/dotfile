x-coverage:
  state: covered
  detail: >-
    Dotfile's complete OpenAPI 3.0.0 (82 paths, 100 operations, 313 schemas) is publicly downloadable at
    https://docs.dotfile.com/openapi/%EF%B8%8F-api-specifications.json, but it is effectively unlisted — the
    ReadMe docs host returns an HTML shell for /openapi.json and /openapi.yaml and the project's OpenAPI
    download privacy is set to "admin". The only anonymous route to it is the RFC 9727 linkset at
    https://docs.dotfile.com/.well-known/api-catalog, which is how it was found.
  evidence:
  - url: https://docs.dotfile.com/.well-known/api-catalog
