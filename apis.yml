apis:
- name: Dotfile API
  description: >-
    REST API covering the full business-verification lifecycle: create a case with its companies, individuals and
    relations, launch checks by template or one at a time, read results, record a review verdict, and close the case.
    Also covers company-data search/fetch against official registries, document orders, files, templates, tables,
    custom properties, tags, notes, activities, users, client portals, webhooks, webhook logs and Autonomy routine
    triggers. Authenticated with a workspace API key in the X-DOTFILE-API-KEY header; HTTPS only.
  humanURL: https://docs.dotfile.com/reference/overview
  baseURL: https://api.dotfile.com/v1
