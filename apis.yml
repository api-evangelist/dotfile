aid: dotfile
name: Dotfile
description: >-
  Dotfile is a French (Paris-based) end-to-end business verification platform that automates KYB, KYC and AML
  compliance for regulated and high-growth companies. A single REST API and a case-management console act on the
  same data: a case holds the companies and individuals under verification, the checks run on them, and the
  decision that closes it. Nine check types are exposed — document, id_document, id_verification, ekyc, aml,
  company_monitoring, electronic_signature, fraud_database and online_reputation — alongside company-data search
  and fetch against official registries, document ordering, risk scoring, periodic review, templates, tables,
  custom properties, white-label client portals, tags, activities and an autonomous "Autonomy" agent routine
  trigger. The API is 100 operations over 82 paths, keyed with an X-DOTFILE-API-KEY header, and reports check
  outcomes asynchronously through 46 subscribable webhook events.
