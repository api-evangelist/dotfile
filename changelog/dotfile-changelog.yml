- date: '2026-08-14'
  breaking: true
  url: https://docs.dotfile.com/changelog/2026-08-14
  highlights:
  - 'BREAKING: Property Origin renamed to Data Lineage across the External API.'
  - Removed optional query parameter property_origin on GET /v1/cases/{id}, /v1/companies/{id}, /v1/individuals/{id}.
  - Added optional query parameter data_lineage (boolean, default false) on the same three operations.
  - Renamed response keys property_origins -> data_lineage on companies[], individuals[] and the single-entity responses.
  - 'Renamed schemas: PropertyOrigin -> DataLineage, PropertyOriginValueSource -> DataLineageValueSource, PropertyOriginValueSourceOrigin -> DataLineageValueSourceOrigin.'
  - 'Migration: requests still sending property_origin return 200 but silently omit lineage — the old parameter is ignored.'
